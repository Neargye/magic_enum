name: Install

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'doc/**']
  pull_request:
    paths-ignore: ['**.md', 'doc/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  header-only-ubuntu:
    timeout-minutes: 30
    name: Header-only / Ubuntu
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Build and install header-only package
        run: |
          cmake -S . -B build-install \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/configured-install" \
            -DMAGIC_ENUM_OPT_BUILD_EXAMPLES=OFF \
            -DMAGIC_ENUM_OPT_BUILD_TESTS=OFF \
            -DMAGIC_ENUM_OPT_VERIFY_INTERFACE_HEADER_SETS=ON
          cmake --build build-install \
            --target magic_enum_verify_interface_header_sets \
            --parallel "$(nproc)"
          cmake --install build-install --prefix "${RUNNER_TEMP}/magic_enum"

      - name: Test installed CMake package
        run: |
          cmake -S . -B build-installed-cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/magic_enum" \
            -DMAGIC_ENUM_OPT_TEST_INSTALLED_VERSION=ON
          cmake --build build-installed-cmake --parallel "$(nproc)"
          ctest --test-dir build-installed-cmake --output-on-failure --no-tests=error

      - name: Test installed pkg-config package
        run: |
          cmake -S . -B build-installed-pkgconfig \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/magic_enum" \
            -DMAGIC_ENUM_OPT_TEST_INSTALLED_VERSION_PKGCONFIG=ON
          cmake --build build-installed-pkgconfig --parallel "$(nproc)"
          ctest --test-dir build-installed-pkgconfig --output-on-failure --no-tests=error

      - name: Test CPack archive
        run: |
          cpack --config build-install/CPackConfig.cmake -G TGZ -B package
          archive="$(find package -maxdepth 1 -name 'magic_enum-*.tar.gz' -print -quit)"
          test -n "${archive}"
          tar -tzf "${archive}" > package-contents.txt
          grep -Eq '(^|/)include/magic_enum/magic_enum_all\.hpp$' package-contents.txt
          grep -Eq '(^|/)share/cmake/magic_enum/magic_enumConfig\.cmake$' package-contents.txt
          grep -Eq '(^|/)share/pkgconfig/magic_enum\.pc$' package-contents.txt
          grep -Eq '(^|/)share/magic_enum/LICENSE$' package-contents.txt

      - name: Test CPack DEB and RPM packages
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          cpack --config build-install/CPackConfig.cmake -G "DEB;RPM" -B package-dist
          version="$(sed -n 's/^set(CPACK_PACKAGE_VERSION "\(.*\)")$/\1/p' build-install/CPackConfig.cmake)"
          deb="package-dist/libmagicenum-dev_${version}_all.deb"
          rpm="package-dist/libmagicenum-devel-${version}-1.noarch.rpm"
          test -f "${deb}"
          test -f "${rpm}"
          test "$(dpkg-deb -f "${deb}" Architecture)" = "all"
          test "$(dpkg-deb -f "${deb}" Section)" = "libdevel"
          dpkg-deb -f "${deb}" Maintainer | grep -Eq '^.+ <.+@.+>$'
          dpkg-deb -c "${deb}" | grep -Eq '/share/pkgconfig/magic_enum\.pc$'
          dpkg-deb -c "${deb}" | grep -Eq '/share/magic_enum/LICENSE$'
          test "$(rpm -qp --queryformat '%{LICENSE}' "${rpm}")" = "MIT"
          rpm -qpl "${rpm}" | grep -Eq '/share/pkgconfig/magic_enum\.pc$'
          rpm -qpl "${rpm}" | grep -Eq '/share/magic_enum/LICENSE$'

      - name: Test DESTDIR install
        run: |
          DESTDIR="${RUNNER_TEMP}/stage" cmake --install build-install
          prefix="${RUNNER_TEMP}/stage${RUNNER_TEMP}/configured-install"
          test -f "${prefix}/include/magic_enum/magic_enum_all.hpp"
          test -f "${prefix}/share/magic_enum/LICENSE"
          export PKG_CONFIG_PATH="${prefix}/share/pkgconfig"
          include_dir="$(pkg-config --variable=includedir magic_enum)"
          test "$(realpath "${include_dir}")" = "$(realpath "${prefix}/include")"
          cat > destdir-consumer.cpp << 'EOF'
          #include <magic_enum/magic_enum_all.hpp>
          enum class Color { Red };
          int main() { return magic_enum::enum_name(Color::Red) == "Red" ? 0 : 1; }
          EOF
          c++ -std=c++17 $(pkg-config --cflags magic_enum) destdir-consumer.cpp -o destdir-consumer
          ./destdir-consumer

      - name: Test absolute install directories
        run: |
          prefix="${RUNNER_TEMP}/absolute install"
          cmake -S . -B build-absolute \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${prefix}" \
            -DCMAKE_INSTALL_INCLUDEDIR="${prefix}/custom include" \
            -DCMAKE_INSTALL_DATAROOTDIR="${prefix}/custom share" \
            -DMAGIC_ENUM_OPT_BUILD_EXAMPLES=OFF \
            -DMAGIC_ENUM_OPT_BUILD_TESTS=OFF
          cmake --install build-absolute
          test -f "${prefix}/custom include/magic_enum/magic_enum_all.hpp"
          export PKG_CONFIG_PATH="${prefix}/custom share/pkgconfig"
          cat > absolute-consumer.cpp << 'EOF'
          #include <magic_enum/magic_enum_all.hpp>
          enum class Color { Red };
          int main() { return magic_enum::enum_name(Color::Red) == "Red" ? 0 : 1; }
          EOF
          # pkg-config output is shell-escaped, so let the shell parse it like make does.
          eval "c++ -std=c++17 $(pkg-config --cflags magic_enum) absolute-consumer.cpp -o absolute-consumer"
          ./absolute-consumer
          mkdir -p absolute-cmake-consumer
          cp absolute-consumer.cpp absolute-cmake-consumer/main.cpp
          cat > absolute-cmake-consumer/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(absolute_consumer CXX)
          find_package(magic_enum CONFIG REQUIRED)
          add_executable(absolute_consumer main.cpp)
          target_link_libraries(absolute_consumer PRIVATE magic_enum::magic_enum)
          EOF
          cmake -S absolute-cmake-consumer -B build-absolute-consumer \
            -Dmagic_enum_DIR="${prefix}/custom share/cmake/magic_enum"
          cmake --build build-absolute-consumer
          ./build-absolute-consumer/absolute_consumer

  module-macos-gcc:
    timeout-minutes: 30
    name: Module / macOS / GCC 16 / fmt::fmt / C++20
    runs-on: macos-15
    env:
      CC: gcc-16
      CXX: g++-16

    steps:
      - uses: actions/checkout@v7

      - name: Checkout fmt
        uses: actions/checkout@v7
        with:
          repository: fmtlib/fmt
          path: fmt-src

      - name: Install GCC 16 and Ninja
        env:
          CC: clang
          CXX: clang++
        run: |
          brew install gcc@16 ninja
          echo "$(brew --prefix gcc@16)/bin" >> "${GITHUB_PATH}"

      - name: Install fmt
        run: |
          python3 -m pip install cmake==4.4.0 --break-system-packages
          cmake -S fmt-src -B build-fmt -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/fmt" \
            -DBUILD_SHARED_LIBS=OFF \
            -DFMT_DOC=OFF \
            -DFMT_MODULE=OFF \
            -DFMT_TEST=OFF
          cmake --build build-fmt --parallel "$(sysctl -n hw.logicalcpu)"
          cmake --install build-fmt

      - name: Build and test installed module package
        run: |
          fmt_prefix="${RUNNER_TEMP}/fmt"
          cmake -S . -B build-module -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_PREFIX_PATH="${fmt_prefix}" \
            -DMAGIC_ENUM_USE_MODULES=ON \
            -DMAGIC_ENUM_MODULE_WITH_FMT=ON \
            -DMAGIC_ENUM_OPT_BUILD_TESTS=ON \
            -DMAGIC_ENUM_OPT_BUILD_EXAMPLES=ON
          cmake --build build-module \
            --parallel "$(sysctl -n hw.logicalcpu)" \
            --target \
              magic_enum_module \
              example_module_usage \
              test_module-cpp20 \
              test_module_aliases-cpp20 \
              test_module_wchar_t-cpp20
          cmake --build build-module \
            --target magic_enum_verify_interface_header_sets \
            --parallel "$(sysctl -n hw.logicalcpu)"
          ctest --test-dir build-module \
            --output-on-failure \
            --no-tests=error \
            -R '^(test_module(_aliases|_wchar_t)?-cpp20|installed-module-consumer)$'

  module-windows-msvc:
    timeout-minutes: 30
    name: Module / Windows / VS 2026 / C++20
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install pinned CMake
        shell: pwsh
        run: python -m pip install cmake==4.3.4

      - name: Build and test installed module package
        shell: pwsh
        run: |
          cmake -S . -B build-module -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_STANDARD=20 `
            -DCMAKE_CXX_STANDARD_REQUIRED=ON `
            -DCMAKE_CXX_EXTENSIONS=OFF `
            -DMAGIC_ENUM_USE_MODULES=ON `
            -DMAGIC_ENUM_OPT_BUILD_TESTS=ON `
            -DMAGIC_ENUM_OPT_BUILD_EXAMPLES=ON
          cmake --build build-module --parallel $env:NUMBER_OF_PROCESSORS --target `
            magic_enum_module `
            example_module_usage `
            test_module-cpp20 `
            test_module_aliases-cpp20 `
            test_module_wchar_t-cpp20
          cmake --build build-module --parallel $env:NUMBER_OF_PROCESSORS --target magic_enum_verify_interface_header_sets
          ctest --test-dir build-module --output-on-failure --no-tests=error -R '^(test_module(_aliases|_wchar_t)?-cpp20|installed-module-consumer)$'
