name: windows

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'doc/**']
  pull_request:
    paths-ignore: ['**.md', 'doc/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 30
    runs-on: ${{ matrix.config.os }}
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        config:
        - { os: windows-2022, compiler: "msvc",      toolset: "",      build_types: [Release, Debug] }
        - { os: windows-2025, compiler: "msvc",      toolset: "",      build_types: [Release, Debug] }
        - { os: windows-2022, compiler: "msvc-v142", toolset: v142,    build_types: [Release] }
        - { os: windows-2025, compiler: "clang-cl",  toolset: ClangCL, build_types: [Release] }
        - { os: windows-11-arm, compiler: "msvc",    toolset: "",      build_types: [Release, Debug], platforms: ARM64 }

    name: "${{ matrix.config.compiler }} (${{ matrix.config.os }})"
    steps:
    - uses: actions/checkout@v7

    - name: Build and test
      run: |
        $PSNativeCommandUseErrorActionPreference = $true # Stop on the first failing command.
        foreach ($platform in "${{ matrix.config.platforms || 'x64 Win32' }}" -split ' ') {
          cmake -S . -B "build-$platform" -A $platform -T "${{ matrix.config.toolset }}"
          foreach ($buildType in "${{ join(matrix.config.build_types, ' ') }}" -split ' ') {
            Write-Output "::group::$platform / $buildType"
            cmake --build "build-$platform" --parallel --config $buildType
            ctest --test-dir "build-$platform" --parallel $env:NUMBER_OF_PROCESSORS --output-on-failure --no-tests=error -C $buildType
            Write-Output "::endgroup::"
          }
        }

    - name: Build C++/CLI smoke test
      if: ${{ (matrix.config.os == 'windows-2022' || matrix.config.os == 'windows-11-arm') && matrix.config.compiler == 'msvc' }}
      run: cmake --build build-${{ matrix.config.platforms || 'x64' }} --parallel --target test_clr --config Release

    - name: Code analysis
      if: ${{ (matrix.config.os == 'windows-2025' || matrix.config.os == 'windows-11-arm') && matrix.config.compiler == 'msvc' }}
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        # Setting CMAKE_CXX_FLAGS replaces the default flags, so repeat them.
        cmake -S . -B build-analyze -A ${{ matrix.config.platforms || 'x64' }} "-DCMAKE_CXX_FLAGS=/DWIN32 /D_WINDOWS /GR /EHsc /analyze"
        cmake --build build-analyze --parallel --config Release
