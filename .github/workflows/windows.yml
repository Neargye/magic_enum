name: windows

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'doc/**']
  pull_request:
    paths-ignore: ['**.md', 'doc/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 30
    runs-on: ${{ matrix.config.os }}
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        config:
        - { os: windows-2022, compiler: "", platform: x64, build_type: Release, clr: true }
        - { os: windows-2022, compiler: "", platform: x64, build_type: Debug }
        - { os: windows-2022, compiler: "", platform: Win32, build_type: Release }
        - { os: windows-2022, compiler: "", platform: Win32, build_type: Debug }
        - { os: windows-2025, compiler: "", platform: x64, build_type: Release }
        - { os: windows-2025, compiler: "", platform: x64, build_type: Debug }
        - { os: windows-2025, compiler: "", platform: Win32, build_type: Release }
        - { os: windows-2025, compiler: "", platform: Win32, build_type: Debug }
        - { os: windows-2022, compiler: "v142", platform: x64, build_type: Release }
        - { os: windows-2022, compiler: "v142", platform: Win32, build_type: Release }
        - { os: windows-2025, compiler: "ClangCL", platform: x64, build_type: Release }
        - { os: windows-2025, compiler: "ClangCL", platform: Win32, build_type: Release }
        - { os: windows-11-arm, compiler: "", platform: ARM64, build_type: Release, clr: true }
        - { os: windows-11-arm, compiler: "", platform: ARM64, build_type: Debug }

    name: "${{ matrix.config.os }} / ${{ matrix.config.platform }} / ${{ matrix.config.build_type }}${{ matrix.config.compiler && format(' / {0}', matrix.config.compiler) || '' }}"
    steps:
    - uses: actions/checkout@v7

    - name: Configure
      run: cmake -S . -B build -A ${{ matrix.config.platform }} -T "${{ matrix.config.compiler }}"

    - uses: ./.github/actions/cmake-test
      with:
        build-type: ${{ matrix.config.build_type }}

    - name: Build C++/CLI smoke test
      if: ${{ matrix.config.clr }}
      run: cmake --build build --parallel $env:NUMBER_OF_PROCESSORS --target test_clr --config Release

  analyze:
    name: MSVC code analysis
    timeout-minutes: 30
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v7
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Code analysis
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        # Analyze our code, not the STL and Windows SDK from INCLUDE.
        cmake -S . -B build-analyze -A x64 "-DCMAKE_CXX_FLAGS=/DWIN32 /D_WINDOWS /GR /EHsc /analyze /external:env:INCLUDE /external:W0 /analyze:external-"
        cmake --build build-analyze --parallel $env:NUMBER_OF_PROCESSORS --config Release
