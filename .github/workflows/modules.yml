name: Modules

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'doc/**']
  pull_request:
    paths-ignore: ['**.md', 'doc/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  modules:
    env:
      CMAKE_VERSION: ${{ matrix.config.cmake }}
      BUILD_TYPES: ${{ matrix.config.build_types }}
    name: ${{ matrix.config.os }} / ${{ matrix.config.compiler }} / CMake ${{ matrix.config.cmake }} / C++${{ matrix.config.standard }} / ${{ matrix.config.stdlib }} / IMPORT_STD=${{ matrix.config.import_std }} / FMT=${{ matrix.config.fmt }}
    timeout-minutes: 30
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: "ubuntu-24.04", compiler: "clang-19", cmake: "4.4.0", standard: 20, stdlib: "libstdc++", import_std: "OFF", fmt: "OFF", build_types: "Release Debug" }
          - { os: "ubuntu-24.04", compiler: "clang-19", cmake: "4.4.0", standard: 23, stdlib: "libc++", import_std: "ON", fmt: "OFF", build_types: "Debug" }
          - { os: "ubuntu-24.04", compiler: "clang-19", cmake: "4.5.1", standard: 20, stdlib: "libstdc++", import_std: "OFF", fmt: "OFF", build_types: "Release Debug" }
          - { os: "ubuntu-24.04", compiler: "clang-19", cmake: "4.5.1", standard: 23, stdlib: "libc++", import_std: "ON", fmt: "OFF", build_types: "Debug" }

          - { os: "ubuntu-26.04", compiler: "gcc-16", cmake: "4.4.0", standard: 20, stdlib: "libstdc++", import_std: "OFF", fmt: "ON", build_types: "Release" }
          - { os: "ubuntu-26.04", compiler: "gcc-16", cmake: "4.4.0", standard: 26, stdlib: "libstdc++", import_std: "ON", fmt: "OFF", build_types: "Release" }
          - { os: "ubuntu-26.04", compiler: "gcc-16", cmake: "4.5.1", standard: 20, stdlib: "libstdc++", import_std: "OFF", fmt: "ON", build_types: "Release" }
          - { os: "ubuntu-26.04", compiler: "gcc-16", cmake: "4.5.1", standard: 26, stdlib: "libstdc++", import_std: "ON", fmt: "OFF", build_types: "Release" }

          - { os: "macos-26", compiler: "clang-22", cmake: "4.4.0", standard: 23, stdlib: "libc++", import_std: "OFF", fmt: "OFF", build_types: "Release Debug" }
          - { os: "macos-26", compiler: "clang-22", cmake: "4.4.0", standard: 23, stdlib: "libc++", import_std: "ON", fmt: "OFF", build_types: "Release" }
          - { os: "macos-26", compiler: "clang-22", cmake: "4.5.1", standard: 23, stdlib: "libc++", import_std: "OFF", fmt: "OFF", build_types: "Release Debug" }
          - { os: "macos-26", compiler: "clang-22", cmake: "4.5.1", standard: 23, stdlib: "libc++", import_std: "ON", fmt: "OFF", build_types: "Release" }

          - { os: "windows-2025", compiler: "MSVC", cmake: "4.4.0", standard: 20, stdlib: "MSVC STL", import_std: "OFF", fmt: "OFF", build_types: "Release" }
          - { os: "windows-2025", compiler: "MSVC", cmake: "4.4.0", standard: 23, stdlib: "MSVC STL", import_std: "ON", fmt: "OFF", build_types: "Release" }
          - { os: "windows-2025", compiler: "MSVC", cmake: "4.5.1", standard: 20, stdlib: "MSVC STL", import_std: "OFF", fmt: "OFF", build_types: "Release" }
          - { os: "windows-2025", compiler: "MSVC", cmake: "4.5.1", standard: 23, stdlib: "MSVC STL", import_std: "ON", fmt: "OFF", build_types: "Release" }

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    - name: Set up Linux compiler
      if: ${{ runner.os == 'Linux' }}
      uses: ./.github/actions/setup-linux-compiler
      with:
        compiler: ${{ matrix.config.compiler }}
        stdlib: ${{ matrix.config.stdlib }}

    - name: Install Clang on macOS
      if: ${{ runner.os == 'macOS' }}
      run: |
        compiler="${{ matrix.config.compiler }}"
        llvm_formula="llvm@${compiler#clang-}"
        brew list --versions "$llvm_formula" > /dev/null 2>&1 || brew install --skip-link "$llvm_formula"
        command -v ninja > /dev/null 2>&1 || brew install ninja
        llvm_prefix="$(brew --prefix "$llvm_formula")"
        echo "${llvm_prefix}/bin" >> "${GITHUB_PATH}"
        echo "CC=${llvm_prefix}/bin/clang" >> "${GITHUB_ENV}"
        echo "CXX=${llvm_prefix}/bin/clang++" >> "${GITHUB_ENV}"
        if [[ "${{ matrix.config.import_std }}" == "ON" ]]; then
          echo "LDFLAGS=-L${llvm_prefix}/lib/c++ -Wl,-rpath,${llvm_prefix}/lib/c++ -L${llvm_prefix}/lib/unwind -lunwind" >> "$GITHUB_ENV"
        fi
        "${llvm_prefix}/bin/clang++" --version

    - name: Install fmt
      if: ${{ matrix.config.fmt == 'ON' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y libfmt-dev

    - name: Install CMake 4.4.0
      if: matrix.config.cmake == '4.4.0'
      run: |
        if [[ "$RUNNER_OS" == Windows ]]; then
          python -m pip install "cmake==$CMAKE_VERSION"
        else
          python3 -m pip install "cmake==$CMAKE_VERSION" --break-system-packages
        fi

    - name: Install CMake 4.5.1
      if: matrix.config.cmake == '4.5.1'
      working-directory: ${{ runner.temp }}
      run: |
        case "$RUNNER_OS" in
          Linux)
            package="cmake-${CMAKE_VERSION}-linux-x86_64"
            archive="$package.tar.gz"
            digest=83b71181fb62b4fe8f26067a9321448572e7a43bd04ff6c7f54a24c33698f16d
            bin="$package/bin"
            ;;
          macOS)
            package="cmake-${CMAKE_VERSION}-macos-universal"
            archive="$package.tar.gz"
            digest=e1fb288543e4eb2a410e385ecebc64323bda51f0205782f2b094ccd5d572ca2d
            bin="$package/CMake.app/Contents/bin"
            ;;
          Windows)
            package="cmake-${CMAKE_VERSION}-windows-x86_64"
            archive="$package.zip"
            digest=bfe6eadb245dc8213e0d3feea316b520cb2aae92f5667ffd76059ba6b05c430c
            bin="$package/bin"
            ;;
        esac
        curl --fail --location --retry 3 --output "$archive" "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/${archive}"
        checksum=$(cmake -E sha256sum "$archive")
        if [[ "${checksum%% *}" != "$digest" ]]; then
          echo "Unexpected SHA-256 for $archive" >&2
          exit 1
        fi
        cmake -E tar xf "$archive"
        echo "${RUNNER_TEMP}/${bin}" >> "$GITHUB_PATH"

    - name: Configure
      id: configure
      run: |
        cmake --version | tr -d '\r' | grep -Fx "cmake version $CMAKE_VERSION"
        toolchain_options=()
        if [[ "${{ matrix.config.stdlib }}" == "libc++" ]]; then
          toolchain_options+=(-DCMAKE_CXX_FLAGS:STRING=-stdlib=libc++)
        fi

        if [[ "$CMAKE_VERSION" == "4.4.0" && "${{ matrix.config.import_std }}" == "ON" ]]; then
          toolchain_options+=(-DCMAKE_EXPERIMENTAL_CXX_IMPORT_STD=f35a9ac6-8463-4d38-8eec-5d6008153e7d)
          if [[ "${{ matrix.config.compiler }}" == gcc-* ]]; then
            toolchain_options+=("-DCMAKE_CXX_STDLIB_MODULES_JSON=$("$CXX" -print-file-name=libstdc++.modules.json)")
          fi
        fi

        for build_type in $BUILD_TYPES; do
          cmake -S . -B "build-${build_type}" -G Ninja \
            -DCMAKE_BUILD_TYPE="${build_type}" \
            -DCMAKE_CXX_STANDARD=${{ matrix.config.standard }} \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DMAGIC_ENUM_USE_MODULES=ON \
            -DMAGIC_ENUM_MODULE_IMPORT_STD=${{ matrix.config.import_std }} \
            -DMAGIC_ENUM_MODULE_WITH_FMT=${{ matrix.config.fmt }} \
            "${toolchain_options[@]}"
        done

    - name: Reconfigure and check import std selection
      run: |
        for build_type in $BUILD_TYPES; do
          cmake -S . -B "build-${build_type}"
          setting=$(grep '^MAGIC_ENUM_MODULE_IMPORT_STD:BOOL=' "build-${build_type}/CMakeCache.txt")
          setting=${setting%$'\r'}
          echo "$setting"
          [[ "$setting" == 'MAGIC_ENUM_MODULE_IMPORT_STD:BOOL=${{ matrix.config.import_std }}' ]]
        done

    - name: Build
      run: |
        targets=(magic_enum_module_tests)
        if [[ "$RUNNER_OS" == Windows ]]; then
          targets+=(magic_enum_verify_interface_header_sets)
        fi
        for build_type in $BUILD_TYPES; do
          cmake --build "build-${build_type}" --target "${targets[@]}"
        done

    - name: Test
      run: |
        for build_type in $BUILD_TYPES; do
          ctest --test-dir "build-${build_type}" --output-on-failure --no-tests=error -L module
        done

    - name: Check import std requires C++23
      if: "!cancelled() && steps.configure.outcome == 'success' && matrix.config.import_std == 'OFF'"
      run: |
        if cmake -S . -B build-reject-cpp20 -G Ninja -DCMAKE_CXX_STANDARD=20 \
            -DMAGIC_ENUM_USE_MODULES=ON -DMAGIC_ENUM_MODULE_IMPORT_STD=ON > configure-cpp20.log 2>&1; then
          echo "C++20 unexpectedly accepted MAGIC_ENUM_MODULE_IMPORT_STD=ON"
          exit 1
        fi
        cat configure-cpp20.log
        grep -F 'MAGIC_ENUM_MODULE_IMPORT_STD requires CMAKE_CXX_STANDARD >= 23' configure-cpp20.log
