name: macos

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'doc/**']
  pull_request:
    paths-ignore: ['**.md', 'doc/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-15
        - macos-26
        compiler: [Apple Clang, GCC]

    name: "${{ matrix.os }} / ${{ matrix.compiler }}"
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Configure compiler
      run: |
        if [[ "${{ matrix.compiler }}" == "GCC" ]]; then
          brew install gcc
          gcc_bin="$(brew --prefix gcc)/bin"
          gcc_version="$(brew list --versions gcc | awk '{print $2}')"
          gcc_major="${gcc_version%%.*}"
          echo "CC=${gcc_bin}/gcc-${gcc_major}" >> "${GITHUB_ENV}"
          echo "CXX=${gcc_bin}/g++-${gcc_major}" >> "${GITHUB_ENV}"
        else
          echo "CC=clang" >> "${GITHUB_ENV}"
          echo "CXX=clang++" >> "${GITHUB_ENV}"
        fi

    - name: Compiler version
      run: |
        compiler="$("$CXX" --version | head -n 1), $(xcodebuild -version | head -n 1)"
        echo "$compiler"
        echo "::notice title=Compiler::$compiler"
        echo "**Compiler:** $compiler" >> "$GITHUB_STEP_SUMMARY"

    - name: Build and test
      run: |
        for build_type in Release Debug; do
          echo "::group::$build_type"
          cmake -S . -B "build-$build_type" -DCMAKE_BUILD_TYPE="$build_type"
          cmake --build "build-$build_type" --parallel "$(sysctl -n hw.logicalcpu)"
          ctest --test-dir "build-$build_type" --parallel "$(sysctl -n hw.logicalcpu)" --output-on-failure --no-tests=error
          echo "::endgroup::"
        done
