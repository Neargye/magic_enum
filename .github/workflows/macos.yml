name: macos

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'doc/**']
  pull_request:
    paths-ignore: ['**.md', 'doc/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config:
        - { os: macos-15, compiler: Apple Clang, build_type: Release }
        - { os: macos-15, compiler: Apple Clang, build_type: Debug }
        - { os: macos-15, compiler: GCC, build_type: Release }
        - { os: macos-15, compiler: GCC, build_type: Debug }
        - { os: macos-26, compiler: Apple Clang, build_type: Release }
        - { os: macos-26, compiler: Apple Clang, build_type: Debug }
        - { os: macos-26, compiler: GCC, build_type: Release }
        - { os: macos-26, compiler: GCC, build_type: Debug }

    name: "${{ matrix.config.os }} / ${{ matrix.config.compiler }} / ${{ matrix.config.build_type }}"
    runs-on: ${{ matrix.config.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Configure compiler
      run: |
        if [[ "${{ matrix.config.compiler }}" == "GCC" ]]; then
          brew install gcc
          gcc_bin="$(brew --prefix gcc)/bin"
          gcc_version="$(brew list --versions gcc | awk '{print $2}')"
          gcc_major="${gcc_version%%.*}"
          echo "CC=${gcc_bin}/gcc-${gcc_major}" >> "${GITHUB_ENV}"
          echo "CXX=${gcc_bin}/g++-${gcc_major}" >> "${GITHUB_ENV}"
        else
          echo "CC=clang" >> "${GITHUB_ENV}"
          echo "CXX=clang++" >> "${GITHUB_ENV}"
        fi

    - name: Compiler version
      run: |
        compiler="$("$CXX" --version | head -n 1), $(xcodebuild -version | head -n 1)"
        echo "$compiler"
        echo "::notice title=Compiler::$compiler"
        echo "**Compiler:** $compiler" >> "$GITHUB_STEP_SUMMARY"

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}

    - uses: ./.github/actions/cmake-test
      with:
        build-type: ${{ matrix.config.build_type }}
