name: ubuntu

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'doc/**']
  pull_request:
    paths-ignore: ['**.md', 'doc/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: "${{ matrix.config.compiler }}${{ matrix.config.stdlib && format(' / {0}', matrix.config.stdlib) || '' }} / ${{ matrix.config.build_type }}"
    timeout-minutes: 30
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        # Users compile the headers with their own flags, so strict rows keep them clean under strict warnings.
        config:
        - { os: ubuntu-22.04, compiler: "gcc-11", build_type: Release, strict: true }
        - { os: ubuntu-22.04, compiler: "gcc-11", build_type: Debug }
        - { os: ubuntu-22.04, compiler: "gcc-12", build_type: Release }
        - { os: ubuntu-24.04, compiler: "gcc-13", build_type: Release }
        - { os: ubuntu-24.04, compiler: "gcc-14", build_type: Release }
        - { os: ubuntu-26.04, compiler: "gcc-15", build_type: Release }
        - { os: ubuntu-26.04, compiler: "gcc-16", build_type: Release, strict: true }
        - { os: ubuntu-22.04, compiler: "clang-13", build_type: Release, strict: true }
        - { os: ubuntu-22.04, compiler: "clang-13", build_type: Debug }
        - { os: ubuntu-22.04, compiler: "clang-14", build_type: Release }
        - { os: ubuntu-22.04, compiler: "clang-15", build_type: Release }
        - { os: ubuntu-22.04, compiler: "clang-16", build_type: Release }
        - { os: ubuntu-24.04, compiler: "clang-17", build_type: Release }
        - { os: ubuntu-24.04, compiler: "clang-18", build_type: Release }
        - { os: ubuntu-24.04, compiler: "clang-19", build_type: Release }
        - { os: ubuntu-24.04, compiler: "clang-20", build_type: Release }
        - { os: ubuntu-24.04, compiler: "clang-21", build_type: Release }
        - { os: ubuntu-24.04, compiler: "clang-22", build_type: Release }
        - { os: ubuntu-24.04, compiler: "clang-23", build_type: Release, strict: true }
        # libc++ evaluates more std::string operations as constants, which changes Clang warnings.
        - { os: ubuntu-24.04, compiler: "clang-23", stdlib: "libc++", build_type: Debug, strict: true }

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-linux-compiler
      with:
        compiler: ${{ matrix.config.compiler }}
        stdlib: ${{ matrix.config.stdlib || 'libstdc++' }}

    - name: Configure
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} \
          -DMAGIC_ENUM_TEST_STRICT_WARNINGS=${{ matrix.config.strict && 'ON' || 'OFF' }} \
          ${{ matrix.config.stdlib == 'libc++' && '-DCMAKE_CXX_FLAGS=-stdlib=libc++' || '' }}

    - name: Build
      run: cmake --build build --parallel "$(nproc)"

    - name: Test
      run: ctest --test-dir build --parallel "$(nproc)" --output-on-failure --no-tests=error

    - name: Require standard reflection tests
      if: ${{ matrix.config.compiler == 'gcc-16' }}
      run: |
        ctest --test-dir build -N -R "^(test-cpp26-reflection|test_std_reflection-auto-cpp26)$" | grep -q "Total Tests: 2"

  sanitize:
    name: "${{ matrix.config.compiler }} / sanitizers"
    timeout-minutes: 30
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - { os: ubuntu-26.04, compiler: "gcc-16" }
        - { os: ubuntu-24.04, compiler: "clang-23" }

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-linux-compiler
      with:
        compiler: ${{ matrix.config.compiler }}

    - name: Configure
      env:
        CXXFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
        LDFLAGS: -fsanitize=address,undefined
      run: |
        # Newer runner kernels use more ASLR entropy than older sanitizer runtimes support.
        sudo sysctl vm.mmap_rnd_bits=28
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build --parallel "$(nproc)"

    - name: Test
      env:
        ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
        UBSAN_OPTIONS: print_stacktrace=1
      run: ctest --test-dir build --parallel "$(nproc)" --output-on-failure --no-tests=error

  fmt:
    name: "fmt ${{ matrix.config.fmt }} / ${{ matrix.config.compiler }}${{ matrix.config.stdlib && format(' / {0}', matrix.config.stdlib) || '' }}"
    timeout-minutes: 30
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        # Distribution packages cover fmt 9 and 10. Newer releases are fetched by commit.
        config:
        - { os: ubuntu-24.04, compiler: "gcc-13", fmt: "9" }
        - { os: ubuntu-26.04, compiler: "gcc-16", fmt: "10" }
        - { os: ubuntu-26.04, compiler: "gcc-16", fmt: "11.2.0", commit: "40626af88bd7df9a5fb80be7b25ac85b122d6c21" }
        - { os: ubuntu-26.04, compiler: "gcc-16", fmt: "12.2.1", commit: "208219daff58f2a7438f6931cc2ddc358acf33ef" }
        - { os: ubuntu-24.04, compiler: "clang-23", stdlib: "libc++", fmt: "12.2.1", commit: "208219daff58f2a7438f6931cc2ddc358acf33ef" }

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-linux-compiler
      with:
        compiler: ${{ matrix.config.compiler }}
        stdlib: ${{ matrix.config.stdlib || 'libstdc++' }}

    - name: Install fmt
      env:
        FMT_VERSION: ${{ matrix.config.fmt }}
        FMT_COMMIT: ${{ matrix.config.commit }}
      run: |
        if [[ -z "${FMT_COMMIT}" ]]; then
          sudo apt-get update
          sudo apt-get install -y libfmt-dev
          dpkg-query -W -f='${Version}\n' libfmt-dev | tee /dev/stderr | grep -q "^${FMT_VERSION}\."
        else
          fmt_dir="${RUNNER_TEMP}/fmt"
          git init -q "${fmt_dir}"
          git -C "${fmt_dir}" fetch -q --depth 1 https://github.com/fmtlib/fmt.git "${FMT_COMMIT}"
          git -C "${fmt_dir}" checkout -q FETCH_HEAD
          echo "CXXFLAGS=-isystem ${fmt_dir}/include" >> "${GITHUB_ENV}"
        fi

    - name: Configure
      run: |
        if [[ "${{ matrix.config.stdlib }}" == "libc++" ]]; then
          export CXXFLAGS="${CXXFLAGS} -stdlib=libc++"
        fi
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMAGIC_ENUM_TEST_REQUIRE_FMT=ON -DMAGIC_ENUM_TEST_STRICT_WARNINGS=ON

    - name: Build and test
      run: |
        mapfile -t targets < <(ctest --test-dir build -N -R "^test_format" | awk '/Test +#/ { print $3 }')
        cmake --build build --parallel "$(nproc)" --target "${targets[@]}"
        ctest --test-dir build --parallel "$(nproc)" --output-on-failure --no-tests=error -R "^test_format"

  bazel:
    name: Bazel
    timeout-minutes: 30
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Test
      working-directory: test
      run: bazelisk test //... --config=ci

  meson:
    name: Meson
    timeout-minutes: 30
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Meson
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build

    - name: Test
      run: |
        for option in false true; do
          echo "::group::hash=$option"
          meson setup "build-meson-$option" -Dhash="$option"
          meson test -C "build-meson-$option" --print-errorlogs
          echo "::endgroup::"
        done
