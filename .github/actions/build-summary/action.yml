name: Build summary
description: Report the selected compiler and runner hardware.
inputs:
  build-dir:
    description: Configured CMake build directory
    default: build
  compiler:
    description: Compiler executable for direct compilation
    default: ''
  meson-build:
    description: Configured Meson build directory
    default: ''
  bazel-dir:
    description: Bazel workspace with completed tests
    default: ''
runs:
  using: composite
  steps:
  - name: Build summary
    shell: bash
    env:
      SUMMARY_BUILD_DIR: ${{ inputs.build-dir }}
      SUMMARY_COMPILER: ${{ inputs.compiler }}
      SUMMARY_MESON_BUILD: ${{ inputs.meson-build }}
      SUMMARY_BAZEL_DIR: ${{ inputs.bazel-dir }}
      SUMMARY_SCRIPT: ${{ github.action_path }}/summary.py
    run: |
      if [[ "$RUNNER_OS" == "Windows" ]]; then
        python "$SUMMARY_SCRIPT"
      else
        python3 "$SUMMARY_SCRIPT"
      fi
