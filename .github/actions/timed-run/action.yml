name: Run with timing
description: Run a CI stage and report its elapsed time, including failures.
inputs:
  name:
    description: Stage name in the job summary
    required: true
  run:
    description: Commands to execute
    required: true
  shell:
    description: bash or pwsh
    default: bash
  working-directory:
    description: Directory for the commands
    default: .
  macos-diagnostics:
    description: Collect detailed macOS resource diagnostics
    default: 'false'
runs:
  using: composite
  steps:
  - name: ${{ inputs.name }}
    shell: bash
    env:
      TIMED_NAME: ${{ inputs.name }}
      TIMED_RUN: ${{ inputs.run }}
      TIMED_SHELL: ${{ inputs.shell }}
      TIMED_DIRECTORY: ${{ inputs.working-directory }}
      TIMED_MACOS_DIAGNOSTICS: ${{ inputs.macos-diagnostics }}
      TIMED_SCRIPT: ${{ github.action_path }}/run.py
    run: |
      if [[ "$RUNNER_OS" == "Windows" ]]; then
        export TIMED_BASH="$(cygpath -w "$BASH")"
        python "$TIMED_SCRIPT"
      else
        export TIMED_BASH="$BASH"
        python3 "$TIMED_SCRIPT"
      fi
